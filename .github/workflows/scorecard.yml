name: OpenSSF Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "41 5 * * 1"
  push:
    branches: [main]

# The analysis reads repository metadata and writes its findings to the security
# tab. It needs no write access to code.
permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      id-token: write
      contents: read
      actions: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # publish_results is deliberately false. Publishing pushes the score to
          # a public API, and this repository has known-unmet criteria -- branch
          # protection needs an admin -- that would be broadcast as a score
          # before anyone has had the chance to act on them. Turn it on once the
          # findings in ketqat-planning#47 are closed.
          publish_results: false

      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 30

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: results.sarif
