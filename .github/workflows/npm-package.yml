name: npm package validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build, test, and verify package policy
        run: npm test

      - name: Clean-install and type-check the tarball
        run: npm run verify:clean-install

      # `dist/` is this checkout's build output; the tarball is what a stranger
      # installs. This drives the artifact as a consumer -- bin links, the
      # exports map resolved by node, the MCP server, and the piped stdout path
      # where the #246 truncation hid.
      - name: Exercise the tarball as an installed consumer
        run: npm run verify:release-consumer
