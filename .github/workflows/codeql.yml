name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly published query finds an old bug without waiting for
    # someone to push. Analysis only runs on changed code otherwise.
    - cron: "27 4 * * 1"

# Least privilege. security-events: write is what uploads the results; nothing
# here needs to write code or packages.
permissions:
  contents: read

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # javascript-typescript covers src/ and the scripts; python covers the
        # runner and the provider adapters.
        language: [javascript-typescript, python]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@3b0bd1d116c0bde30213346b22d4f634d96a2fb0 # v3
        with:
          languages: ${{ matrix.language }}
          # security-and-quality is broader than the default and surfaces the
          # parsing and validation mistakes that matter most in a library whose
          # job is reading untrusted scientific payloads.
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@3b0bd1d116c0bde30213346b22d4f634d96a2fb0 # v3

      - name: Analyze
        uses: github/codeql-action/analyze@3b0bd1d116c0bde30213346b22d4f634d96a2fb0 # v3
        with:
          category: "/language:${{ matrix.language }}"
