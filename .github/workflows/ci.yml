name: SDK CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm test

  # The image shipped broken once: the entrypoint imports ../dist/index.js, the
  # Dockerfile flattened it to /app/entrypoint.mjs, and every container exited
  # with ERR_MODULE_NOT_FOUND. Nothing caught it -- `npm test` runs the
  # entrypoint from the repository where the path is right, and a Docker build
  # does not run the entrypoint. So the container is now built and a real job is
  # run through it.
  worker-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # dist/ is committed, but building here means the image is verified
      # against the current source rather than against whatever was last
      # committed.
      - name: Build
        run: npm run build

      - name: Build the worker image and run a job through it
        run: npm run verify:worker-image

  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The cross-language catalog parity test runs the TypeScript suitability
      # implementation through node and compares it with the Python one, so this
      # job needs the JS dependencies. Without them the test would skip, and a
      # divergence between the two languages would reach users unnoticed.
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install runner with real QEC dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "python[qec]"
          python -m pip install pytest

      - name: Run Python tests
        run: pytest python/tests

      - name: Smoke-test real QEC runner
        run: ketqat run surface-code-memory --output /tmp/ketqat-qec-run.json

  quickstart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify clone-free quickstart
        run: npm run verify:quickstart
