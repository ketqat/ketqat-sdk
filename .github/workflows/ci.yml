name: SDK CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege. This workflow runs on pull_request, including from forks, so
# it executes code the repository does not control. Without this block it
# inherits the repository default, which may include write scopes. Read is all
# it needs to build and test.
permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and test
        run: npm test

      # Validates the shipped templates and example only. Contributed files are
      # validated by the same command on the contributor's machine and in the
      # pull-request job below, which parses data and never executes it.
      - name: Validate contribution examples
        run: npm run validate:contribution -- contrib/examples/filled-benchmark-result.yaml

  # The image shipped broken once: the entrypoint imports ../dist/index.js, the
  # Dockerfile flattened it to /app/entrypoint.mjs, and every container exited
  # with ERR_MODULE_NOT_FOUND. Nothing caught it -- `npm test` runs the
  # entrypoint from the repository where the path is right, and a Docker build
  # does not run the entrypoint. So the container is now built and a real job is
  # run through it.
  worker-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # dist/ is committed, but building here means the image is verified
      # against the current source rather than against whatever was last
      # committed.
      - name: Build
        run: npm run build

      - name: Build the worker image and run a job through it
        run: npm run verify:worker-image

  python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # The cross-language catalog parity test runs the TypeScript suitability
      # implementation through node and compares it with the Python one, so this
      # job needs the JS dependencies. Without them the test would skip, and a
      # divergence between the two languages would reach users unnoticed.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install runner with real QEC dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "python[qec,resources,mitigation,interop]"
          python -m pip install pytest

      # The surface-code model is differentially tested against Qualtran, which is
      # Python, while the model itself is TypeScript -- so this needs both, and this
      # is the only job that has both. --require makes an absent Qualtran a failure
      # rather than a skip: a check that silently skips reads as a pass.
      - name: Build TypeScript for the resource-model parity check
        run: npm run build

      - name: Verify surface-code model against Qualtran and QDK
        run: python scripts/verify-resource-model-parity.py --require

      # Mitiq is the reference for the ZNE extrapolation, the one piece of the mitigation
      # pipeline with a single right answer. Same job for the same reason: it needs Node
      # for the model and Python for the reference.
      - name: Verify ZNE extrapolation against Mitiq
        run: python scripts/verify-mitiq-parity.py --require

      - name: Run Python tests
        run: pytest python/tests

      - name: Smoke-test real QEC runner
        run: ketqat run surface-code-memory --output /tmp/ketqat-qec-run.json

  # Provider adapters run against the vendors' own local and fake facilities.
  # Their own job because the SDKs are large and the base install must stay
  # small; installing them into the main Python job would make every run pay for
  # them. Nothing here can submit a paid task or reach a physical device.
  providers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install the provider extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "python[ibm,braket]"
          python -m pip install pytest

      # No AWS or IBM credentials are configured, and that is deliberate: the
      # tests must pass without them, since the not-run paths are part of what
      # they check.
      - name: Run provider tests
        # test_noise_channels needs the braket extra this job installs; in the plain
        # python job it would importorskip, and a skip reads as a pass.
        run: pytest python/tests/test_providers.py python/tests/test_cancellation.py python/tests/test_noise_channels.py -v

      # The tests would still pass if both extras were missing, because each is
      # skipped when its SDK is absent. That would be a silent hole, so this
      # asserts the extras actually installed.
      - name: Assert the adapters were exercised, not skipped
        run: |
          python - <<'PY'
          from ketqat_runner.providers import braket, ibm
          missing = [name for name, mod in (("ibm", ibm), ("braket", braket)) if not mod.available()]
          if missing:
              raise SystemExit(f"provider extras did not install: {missing}")
          print("both provider adapters are installed and were exercised")
          PY

  quickstart:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Verify clone-free quickstart
        run: npm run verify:quickstart
