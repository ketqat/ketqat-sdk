[project]
name = "ketqat"
version = "0.2.0"
description = "Local benchmark runner for KetQat QEC and quantum-algorithm experiments. Run 'ketqat run <manifest>' to reproduce or submit results to ketqat.com."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
urls = { Homepage = "https://ketqat.com", Repository = "https://github.com/ketqat/ketqat-sdk", Issues = "https://github.com/ketqat/ketqat-sdk/issues" }
dependencies = [
  "PyYAML>=6.0",
  "pydantic>=2.7",
  "jsonschema>=4.22",
]

[project.optional-dependencies]
qec = ["numpy>=1.26", "stim>=1.13", "pymatching>=2.2"]
algorithms = ["numpy>=1.26"]
# Qualtran is the reference implementation this project's surface-code model is
# differentially tested against (scripts/verify-qualtran-parity.py). An extra, not a
# core dependency: it pulls Cirq, Jupyter and a density-matrix simulator, none of
# which the runner needs. The parity check skips loudly when it is absent.
resources = ["qualtran>=0.7"]
benchmarks = ["mqt.bench>=2.2", "qiskit>=1.0", "supermarq>=0.5", "cirq-core>=1.4", "qedcbench>=2.0", "pennylane>=0.40", "pennylane-qiskit>=0.40", "pytket>=2.0", "pyqir>=0.10"]
# Provider adapters are extras so the base install stays small and a machine
# without a vendor SDK gets a clear message instead of an ImportError deep in a
# call stack. qiskit-aer is required, not optional: IBM's fake backends need it
# to apply the recorded device noise, and without it they silently fall back to
# a 24-qubit ideal simulator that cannot run a circuit routed onto a 127-qubit
# device.
ibm = ["qiskit>=1.2", "qiskit-ibm-runtime>=0.30", "qiskit-aer>=0.15"]
braket = ["amazon-braket-sdk>=1.80"]
all = ["qualtran>=0.7", "numpy>=1.26", "stim>=1.13", "pymatching>=2.2", "mqt.bench>=2.2", "qiskit>=1.0", "supermarq>=0.5", "cirq-core>=1.4", "qedcbench>=2.0", "pennylane>=0.40", "pennylane-qiskit>=0.40", "pytket>=2.0", "pyqir>=0.10"]

[project.scripts]
ketqat = "ketqat_runner.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ketqat_runner"]

[tool.hatch.build.targets.sdist]
include = ["src/ketqat_runner", "pyproject.toml"]
